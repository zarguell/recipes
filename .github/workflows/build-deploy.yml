name: Build & Deploy Recipe Site

on:
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - '.github/workflows/build-deploy.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1) Checkout the content repo (this repo)
      - name: Checkout recipes repo
        uses: actions/checkout@v4

      # 2) Checkout the template/engine repo
      - name: Checkout template repo
        uses: actions/checkout@v4
        with:
          repository: zarguell/cooklang-recipes
          ref: main
          path: template

      # 3) Copy recipes into the template
      - name: Copy recipes into template
        run: |
          rm -rf template/recipes
          mkdir -p template/recipes
          cp -R recipes/. template/recipes/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: template/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: template

      - name: Build site
        run: npm run build
        working-directory: template
        env:
          CI: true

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: template/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
